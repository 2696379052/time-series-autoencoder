data:
  _target_: tsa.dataset.LOBSTERTimeSeriesDataset
  task:
    _target_: tsa.dataset.Tasks
    value: reconstruction
  data_path: "../data/lobster"
  batch_size: 16
  seq_length: 64
  prediction_window: 1
  target_source: features
  message_columns: null
  orderbook_columns: null
  build_if_missing: false
  builder_kwargs:
    data_dir_name: "GC"
  prefer_val_split: true
  shuffle_train: false

training:
  batch_size: ${data.batch_size}
  denoising: False
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 64
  hidden_size_decoder: 64
  input_att: True
  lr: 1e-5
  lrs_step_size: 5000
  max_grad_norm: 0.1
  num_epochs: 100
  output_size: 1
  reg1: True
  reg2: False
  reg_factor1: 1e-4
  reg_factor2: 1e-4
  seq_len: ${data.seq_length}
  temporal_att: True

general:
  do_eval: True
  do_train: True
  logging_steps: 100
  output_dir: "output"
  save_steps: 5000
  eval_during_training: True
