data:
  _target_: tsa.dataset.LOBSTERTimeSeriesDataset
  task:
    _target_: tsa.dataset.Tasks
    value: prediction  # 改为预测任务
  data_path: "../../data"  # 修正数据路径
  batch_size: 32
  seq_length: 64
  prediction_window: 1
  target_source: labels  # 使用标签作为预测目标
  label_type: long  # 可选: long 或 short
  message_columns: null  # null表示使用所有message列
  orderbook_columns: null  # null表示使用所有orderbook列
  build_if_missing: true  # 如果数据未处理，自动构建
  builder_kwargs:
    data_dir_name: "GC"
    split_rates: [0.6, 0.2, 0.2]  # train/val/test划分比例
    stop_loss_ticks: 6
    take_profit_ratio: 1.5
    tick_size: 0.1
    max_steps: 64
  prefer_val_split: true
  shuffle_train: false

training:
  batch_size: ${data.batch_size}
  denoising: False
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 64
  hidden_size_decoder: 64
  input_att: True
  lr: 1e-5
  lrs_step_size: 5000
  max_grad_norm: 0.1
  num_epochs: 100
  output_size: 1
  reg1: True
  reg2: False
  reg_factor1: 1e-4
  reg_factor2: 1e-4
  seq_len: ${data.seq_length}
  temporal_att: True

general:
  do_eval: True
  do_train: True
  logging_steps: 100
  output_dir: "output"
  save_steps: 5000
  eval_during_training: True
