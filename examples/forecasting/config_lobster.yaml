data:
  _target_: tsa.dataset.LOBSTERTimeSeriesDataset
  task:
    _target_: tsa.dataset.Tasks
    value: prediction  # 改为预测任务
  # 相对于项目根目录的 data 目录，由 Hydra 的 to_absolute_path 解析
  data_path: "data"
  batch_size: 32
  seq_length: 64
  prediction_window: 1
  target_source: labels  # 使用标签作为预测目标
  label_type: long  # 可选: long 或 short
  message_columns: null  # null表示使用所有message列
  orderbook_columns: null  # null表示使用所有orderbook列
  build_if_missing: true  # 如果数据未处理，自动构建
  builder_kwargs:
    data_dir_name: "GC"
    split_rates: [0.6, 0.2, 0.2]  # train/val/test划分比例
    stop_loss_ticks: 6
    take_profit_ratio: 1.5
    tick_size: 0.1
    max_steps: 64
  prefer_val_split: true
  shuffle_train: false
  # DataLoader 性能参数 (Windows 上 num_workers > 0 需要 if __name__ == '__main__' 保护)
  num_workers: 0  # 设置为 2-4 可提升数据加载速度
  pin_memory: true  # GPU 训练时加速内存传输
  persistent_workers: false  # num_workers > 0 时可设为 true

training:
  batch_size: ${data.batch_size}
  denoising: False
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 64
  hidden_size_decoder: 64
  input_att: True
  lr: 1e-5
  lrs_step_size: 5000
  max_grad_norm: 0.1
  num_epochs: 100
  output_size: 1
  reg1: True
  reg2: False
  reg_factor1: 1e-4
  reg_factor2: 1e-4
  seq_len: ${data.seq_length}
  temporal_att: True
  use_amp: false  # 混合精度训练 (GPU 训练时可设为 true 提升 30-50% 速度)

general:
  do_eval: True
  do_train: True
  logging_steps: 100
  output_dir: "output"
  save_steps: 5000
  # 关闭训练过程中的频繁评估，只在训练结束后做一次完整评估
  eval_during_training: False
