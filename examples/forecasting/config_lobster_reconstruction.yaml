# LOBSTER 数据重构任务配置
# 用于学习订单簿数据的表示，不进行标签预测
data:
  _target_: tsa.dataset.LOBSTERTimeSeriesDataset
  task:
    _target_: tsa.dataset.Tasks
    value: reconstruction
  data_path: "../../data"
  batch_size: 32
  seq_length: 64
  prediction_window: 1
  target_source: features  # 重构输入特征
  message_columns: null
  orderbook_columns: null
  build_if_missing: true
  builder_kwargs:
    data_dir_name: "GC"
    split_rates: [0.6, 0.2, 0.2]
    stop_loss_ticks: 6
    take_profit_ratio: 1.5
    tick_size: 0.1
    max_steps: 64
  prefer_val_split: true
  shuffle_train: false

training:
  batch_size: ${data.batch_size}
  denoising: False  # 可设为True启用去噪
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 128  # 重构任务可用更大的隐藏层
  hidden_size_decoder: 128
  input_att: True
  lr: 1e-4
  lrs_step_size: 5000
  max_grad_norm: 0.5
  num_epochs: 100
  output_size: 1  # 会自动调整为特征数量
  reg1: True
  reg2: False
  reg_factor1: 1e-5
  reg_factor2: 1e-4
  seq_len: ${data.seq_length}
  temporal_att: True

general:
  do_eval: True
  do_train: True
  logging_steps: 100
  output_dir: "output_lobster_reconstruction"
  save_steps: 1000
  eval_during_training: True
