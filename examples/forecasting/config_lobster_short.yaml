# LOBSTER Short标签预测配置
# 预测做空信号：1=止盈, 0=止损
data:
  _target_: tsa.dataset.LOBSTERTimeSeriesDataset
  task:
    _target_: tsa.dataset.Tasks
    value: prediction
  # 相对于项目根目录的 data 目录，由 Hydra 的 to_absolute_path 解析
  data_path: "data"
  batch_size: 32
  seq_length: 64
  prediction_window: 1
  target_source: labels  # 使用labels作为目标
  label_type: short  # Short标签
  message_columns: null
  orderbook_columns: null
  build_if_missing: true
  builder_kwargs:
    data_dir_name: "GC"
    split_rates: [0.6, 0.2, 0.2]
    stop_loss_ticks: 6
    take_profit_ratio: 1.5
    tick_size: 0.1
    max_steps: 64
  prefer_val_split: true
  shuffle_train: false

training:
  batch_size: ${data.batch_size}
  denoising: False
  directions: 1
  gradient_accumulation_steps: 1
  hidden_size_encoder: 64
  hidden_size_decoder: 64
  input_att: True
  lr: 1e-4
  lrs_step_size: 3000
  max_grad_norm: 0.5
  num_epochs: 150
  output_size: 1  # 二分类标签
  reg1: True
  reg2: False
  reg_factor1: 1e-4
  reg_factor2: 1e-4
  seq_len: ${data.seq_length}
  temporal_att: True

general:
  do_eval: True
  do_train: True
  logging_steps: 100
  output_dir: "output_lobster_short"
  save_steps: 1000
  # 关闭训练过程中的频繁评估，只在训练结束后做一次完整评估
  eval_during_training: False
